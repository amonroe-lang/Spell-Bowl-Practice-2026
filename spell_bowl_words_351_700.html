<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Junior 2026 Spell Bowl - Words 351-700</title>
<style>
:root{--navy:#102a56;--blue:#2457a7;--gold:#f5b82e;--bg:#eef4fb;--card:#fff;--good:#138a44;--bad:#c93636;--muted:#667085;--purple:#6d3cc6}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:linear-gradient(135deg,#eaf2fc,#f8fbff);color:#172033}
header{background:linear-gradient(100deg,var(--navy),var(--blue));color:white;padding:20px;text-align:center;border-bottom:6px solid var(--gold)}
header h1{margin:0;font-size:clamp(24px,4vw,38px)}header p{margin:5px 0 0;font-weight:700;color:#ffe29a}
.wrap{max-width:980px;margin:22px auto;padding:0 16px}.card{background:var(--card);border-radius:18px;padding:20px;box-shadow:0 10px 28px rgba(16,42,86,.11);margin-bottom:18px}
.hidden{display:none!important}.mode-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:14px}.mode{border:2px solid #d9e2ef;border-radius:16px;background:#fff;padding:16px;cursor:pointer;text-align:left}.mode:hover{border-color:var(--blue);transform:translateY(-1px)}.mode strong{display:block;color:var(--navy);font-size:18px}.mode span{font-size:13px;color:var(--muted)}
label{font-weight:800}input[type=text]{width:100%;font-size:22px;padding:14px;border-radius:12px;border:2px solid #cfd8e6}button{border:0;border-radius:12px;padding:12px 18px;font-size:16px;font-weight:800;cursor:pointer;background:var(--blue);color:#fff;margin:4px}button:hover{filter:brightness(.95)}button.alt{background:#e8eef7;color:#16233d}button.gold{background:var(--gold);color:#342500}button.danger{background:#b42318}.center{text-align:center}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.stat{background:#f2f6fc;border-radius:13px;padding:10px;text-align:center}.stat b{font-size:23px;display:block;color:var(--navy)}
.wordbox{text-align:center;padding:18px 0}.listen{font-size:72px;border-radius:50%;width:104px;height:104px;padding:0;background:var(--navy)}.instruction{text-align:center;font-size:18px;font-weight:750}.feedback{min-height:36px;text-align:center;font-size:21px;font-weight:900;margin:12px}.good{color:var(--good)}.bad{color:var(--bad)}.answer{text-align:center;font-size:25px;font-weight:900;color:var(--purple)}
.timerbar{height:12px;background:#e8eef7;border-radius:99px;overflow:hidden}.timerfill{height:100%;background:var(--gold);width:100%;transition:width .25s linear}.results{font-size:18px}.results h2{text-align:center;color:var(--navy)}.bigscore{text-align:center;font-size:56px;font-weight:900;color:var(--navy)}
.pill{display:inline-block;background:#eef4ff;border-radius:999px;padding:7px 11px;margin:3px;font-size:13px}.small{font-size:13px;color:var(--muted)}
@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}.listen{width:90px;height:90px;font-size:60px}}
</style>
</head>
<body>
<header><h1>🏆 Junior 2026 Spell Bowl Practice</h1><p>Words 351-700 • 350 words loaded</p></header>
<div class="wrap">
<section id="home" class="card">
<h2>Choose your game mode</h2>
<label>Student name</label><input id="studentName" type="text" placeholder="Enter your name (optional)">
<div class="mode-grid">
 <button class="mode" onclick="startMode('practice')"><strong>🎯 Practice</strong><span>Random words with instant feedback. Keep going as long as you want.</span></button>
 <button class="mode" onclick="startMode('challenge')"><strong>🏅 9-Word Challenge</strong><span>A focused 9-word round with a final score.</span></button>
 <button class="mode" onclick="startMode('lightning')"><strong>⚡ Lightning Round</strong><span>Spell as many as you can in 60 seconds.</span></button>
 <button class="mode" onclick="startMode('streak')"><strong>🔥 Streak Mode</strong><span>Build a streak. You have 3 lives.</span></button>
 <button class="mode" onclick="startMode('missed')"><strong>🔁 Missed Words</strong><span>Practice only the words missed on this device.</span></button>
</div>
<p class="small">Missed words are saved only in this browser on this device.</p>
</section>

<section id="game" class="hidden">
<div class="stats card">
 <div class="stat"><b id="modeLabel">Practice</b>Mode</div>
 <div class="stat"><b id="score">0</b>Score</div>
 <div class="stat"><b id="correct">0</b>Correct</div>
 <div class="stat"><b id="wrong">0</b>Missed</div>
 <div class="stat"><b id="progress">0</b>Progress</div>
</div>
<div id="timerWrap" class="card hidden"><div class="timerbar"><div id="timerFill" class="timerfill"></div></div><div class="center"><b id="timerText">60 seconds</b></div></div>
<div class="card">
 <div class="instruction">Listen to the word, then type the spelling.</div>
 <div class="wordbox"><button class="listen" onclick="speakWord()" aria-label="Hear word">🔊</button></div>
 <div class="center"><button onclick="speakWord()">🔊 Hear Again</button><button class="alt" onclick="skipWord()">Skip Word</button></div>
 <div style="margin-top:16px"><input id="answer" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type the spelling here"></div>
 <div class="center" style="margin-top:10px"><button class="gold" onclick="submitAnswer()">Submit Spelling</button></div>
 <div id="feedback" class="feedback"></div><div id="answerReveal" class="answer"></div>
 <div class="center"><button class="alt" onclick="goHome()">Change Mode</button></div>
</div>
</section>

<section id="results" class="card hidden results">
 <h2 id="resultTitle">Round Complete!</h2><div id="bigScore" class="bigscore"></div><div id="resultDetails" class="center"></div>
 <div id="missedDisplay" class="center" style="margin-top:12px"></div>
 <div class="center" style="margin-top:16px"><button class="gold" onclick="practiceAgain()">🔄 Practice Again</button><button onclick="goHome()">Choose Another Mode</button></div>
</section>
</div>
<script>
const WORDS=["decompose", "decumbent", "deep-dish", "definitely", "dehydration", "delectation", "demeanor", "demesne", "denim", "dentist", "departure", "deployment", "depot", "deputation", "derived", "described", "desiccation", "desperation", "dessert", "deter", "devastate", "devoid", "diabetes", "dialogue", "diastolic", "diction", "dignify", "dilemma", "diphtheria", "directory", "disagreement", "disappearance", "disclaim", "discordant", "discreet", "discrete", "disembarkation", "disgustingly", "disinfection", "dismal", "disorganize", "dispensatory", "dispossess", "disruption", "dissimilarity", "dissuasion", "distinct", "distributive", "diurnal", "divest", "divot", "documentation", "do-it-yourself", "domicile", "dormitory", "double-cross", "dovecote", "dowry", "dragoon", "drizzly", "dual", "duel", "duplex", "dustcover", "dyspepsia", "echinacea", "ecology", "edible", "edict", "effectuality", "efflorescence", "eglantine", "Egyptology", "eking", "Elba", "electricity", "electrometer", "elegy", "elicitation", "ellipsis", "elude", "embellishment", "embolus", "embryonic", "eminence", "emissary", "employee", "emulous", "emulsion", "enclosure", "encyclopedia", "endoplasmic", "enervate", "engagement", "enigma", "entertain", "entreaty", "envelopment", "Eocene", "epidermal", "epistrophe", "epochal", "equator", "equipage", "erase", "eroding", "ersatz", "escapade", "escutcheon", "esquire", "estopping", "etherealize", "etiological", "euphoria", "evade", "evasion", "eversion", "Excalibur", "excavate", "excessive", "exclude", "exculpate", "executrix", "exhaustion", "existence", "expanse", "expediency", "explicate", "exponential", "expression", "extemporize", "extermination", "extracurricular", "extraterrestrial", "eyesight", "facetious", "fait accompli", "fall out", "fallout", "familiarization", "farina", "fascicle", "fauteuil", "faux pas", "feature", "fedora", "felinity", "ferruginous", "festal", "fiberboard", "fiery", "filament", "finance", "fine-tooth comb", "firefly", "fiscal", "flamboyance", "flapper", "flattop", "flexion", "flicker", "flippant", "floe", "florescence", "flotilla", "flow", "fluctuation", "fluoridate", "focaccia", "foliaceous", "fondant", "forbearance", "forecaster", "forehanded", "foresee", "formaldehyde", "formidability", "forte", "fortunate", "foyer", "frantically", "frescoes", "fretted", "frigate", "frontispiece", "frosty", "frugal", "fuchsia", "fulminate", "functionary", "funicular", "fury", "fusing", "Gabriel", "gallantry", "galvanic", "ganache", "garde-manger", "garner", "Gascony", "gateau", "gauntlet", "gazpacho", "geminate", "generalization", "genet", "geodesic", "geographical", "geotechnical", "geotectonic", "gerontological", "ghostwritten", "gigantic", "gingersnap", "gizzard", "glaucoma", "glissando", "globule", "glottis", "godfather", "good-hearted", "gouging", "grammar", "grand finale", "graphically", "gratifying", "gravure", "Grecian", "grenadier", "grisaille", "gristle", "grommet", "grosgrain", "guayabera", "guilty", "gumption", "gustatory", "guyot", "gymkhana", "habitation", "hafnium", "Halifax", "halyard", "handicapping", "harpsichord", "hasten", "Hawaiian", "hawthorn", "Hawthorne", "hearse", "heavy-duty", "hefty", "heliotropism", "hematite", "henna", "herbal", "heroine", "Hesperus", "hexapod", "high-spirited", "hirsute", "histrionics", "hitchhike", "hocus-pocus", "homophone", "honor", "hospitality", "hot-melt", "humectant", "humeral", "humor", "hungrily", "hybrid", "hydroelectric", "hydrophobic", "hygienist", "hypertrophic", "hypocrite", "hysterical", "icicle", "identification", "idiosyncrasy", "ignominious", "illegibility", "illuminate", "imagery", "imbricate", "immanent", "immigrate", "imminent", "immortalize", "immutable", "impassibility", "impede", "imperceptible", "impermanent", "impinging", "impolite", "impossibility", "impresario", "imprint", "imprudence", "imputing", "inadequate", "inattentive", "incapable", "inception", "incipience", "inclinometer", "incomprehensible", "incongruity", "incontestable", "incorruptibility", "incubator", "indelibility", "indescribable", "indictment", "Indo-Chinese", "inductance", "industrialist", "ineligible", "inequality", "inexorable", "infamous", "inferential", "infestation", "inflaming", "inflow", "infrequent", "ingestion", "inhabitation", "inherent", "inject", "innocuous", "innovation", "inorganically", "insatiable", "insignia", "insipid", "inspector", "instigating", "instrumentation", "intaglio", "intangibility", "intemperance", "interaction", "interdiction", "interlinear", "intermix", "interpretation"];
const STORAGE_KEY='spellbowl_missed_351_700';
let pool=[], current='', currentIndex=0, mode='practice', score=0, correct=0, wrong=0, answered=false, roundTarget=0, lives=3, streak=0, maxStreak=0, timer=null, timeLeft=60, sessionMissed=[];
const $=id=>document.getElementById(id);
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function savedMissed(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]')}catch{return []}}
function saveMissedWord(w){let a=savedMissed();if(!a.includes(w))a.push(w);localStorage.setItem(STORAGE_KEY,JSON.stringify(a))}
function removeMissedWord(w){let a=savedMissed().filter(x=>x!==w);localStorage.setItem(STORAGE_KEY,JSON.stringify(a))}
function startMode(m){mode=m;score=correct=wrong=0;streak=maxStreak=0;lives=3;sessionMissed=[];currentIndex=0;answered=false;clearInterval(timer);$('results').classList.add('hidden');$('home').classList.add('hidden');$('game').classList.remove('hidden');$('timerWrap').classList.add('hidden');
 if(m==='missed'){pool=shuffle(savedMissed().filter(w=>WORDS.includes(w))); if(!pool.length){alert('No missed words are saved yet. Try Practice or the 9-Word Challenge first!');goHome();return;} roundTarget=pool.length;}
 else {pool=shuffle(WORDS); roundTarget=m==='challenge'?Math.min(9,pool.length):0;}
 if(m==='lightning'){roundTarget=0;timeLeft=60;$('timerWrap').classList.remove('hidden');startTimer();}
 updateStats();nextWord();}
function modeName(){return {practice:'Practice',challenge:'9-Word Challenge',lightning:'Lightning',streak:'Streak',missed:'Missed Words'}[mode]}
function speakWord(){if(!current)return;if(!('speechSynthesis'in window)){alert('Speech is not supported in this browser. Try Chrome, Edge, or Safari.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(current);u.rate=.78;u.pitch=1;speechSynthesis.speak(u)}
function nextWord(){answered=false;$('answer').value='';$('feedback').textContent='';$('answerReveal').textContent='';
 if(mode==='challenge' && currentIndex>=roundTarget){endRound();return}
 if(mode==='missed' && currentIndex>=roundTarget){endRound();return}
 if(mode==='streak' && lives<=0){endRound();return}
 if(pool.length===0){pool=shuffle(mode==='missed'?savedMissed().filter(w=>WORDS.includes(w)):WORDS);if(!pool.length){endRound();return}}
 current=pool.shift();currentIndex++;updateStats();$('answer').focus();setTimeout(speakWord,250)}
function normalize(s){return s.trim().toLocaleLowerCase()}
function submitAnswer(){if(!current||answered)return;let val=$('answer').value.trim();if(!val){$('feedback').textContent='Type a spelling first.';return}answered=true;
 if(normalize(val)===normalize(current)){correct++;score+=10;streak++;maxStreak=Math.max(maxStreak,streak);$('feedback').innerHTML='<span class="good">✅ Correct! +10</span>';if(mode==='missed')removeMissedWord(current)}
 else{wrong++;streak=0;if(mode==='streak')lives--;saveMissedWord(current);sessionMissed.push(current);$('feedback').innerHTML='<span class="bad">❌ Not quite.</span>';$('answerReveal').textContent='Correct spelling: '+current}
 updateStats();setTimeout(()=>{if(mode==='lightning'&&timeLeft<=0)return;nextWord()},1300)}
function skipWord(){if(!current||answered)return;answered=true;wrong++;streak=0;if(mode==='streak')lives--;saveMissedWord(current);sessionMissed.push(current);$('feedback').innerHTML='<span class="bad">Skipped</span>';$('answerReveal').textContent='Correct spelling: '+current;updateStats();setTimeout(nextWord,1300)}
function updateStats(){$('modeLabel').textContent=modeName();$('score').textContent=score;$('correct').textContent=correct;$('wrong').textContent=wrong;
 let p='';if(mode==='challenge'||mode==='missed')p=Math.min(currentIndex,roundTarget)+' / '+roundTarget;else if(mode==='streak')p='🔥 '+streak+' • ❤️ '+lives;else p=(correct+wrong)+' done';$('progress').textContent=p}
function startTimer(){updateTimer();timer=setInterval(()=>{timeLeft-=.25;if(timeLeft<=0){timeLeft=0;updateTimer();clearInterval(timer);endRound();return}updateTimer()},250)}
function updateTimer(){$('timerText').textContent=Math.ceil(timeLeft)+' seconds';$('timerFill').style.width=(timeLeft/60*100)+'%'}
function endRound(){clearInterval(timer);speechSynthesis?.cancel?.();$('game').classList.add('hidden');$('results').classList.remove('hidden');let total=correct+wrong;let pct=total?Math.round(correct/total*100):0;let name=$('studentName').value.trim();$('resultTitle').textContent=(name?name+', ':'')+'Round Complete!';$('bigScore').textContent=score+' pts';
 let extra=mode==='streak'?' • Best streak: '+maxStreak:'';$('resultDetails').innerHTML='<b>'+correct+'</b> correct • <b>'+wrong+'</b> missed • <b>'+pct+'%</b>'+extra;
 let unique=[...new Set(sessionMissed)];$('missedDisplay').innerHTML=unique.length?'<b>Words to review:</b><br>'+unique.map(w=>'<span class="pill">'+escapeHtml(w)+'</span>').join(''):'<span class="good"><b>Perfect round — no missed words!</b></span>'}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function practiceAgain(){startMode(mode)}
function goHome(){clearInterval(timer);speechSynthesis?.cancel?.();$('game').classList.add('hidden');$('results').classList.add('hidden');$('home').classList.remove('hidden')}
$('answer').addEventListener('keydown',e=>{if(e.key==='Enter')submitAnswer()});
</script>
</body></html>
